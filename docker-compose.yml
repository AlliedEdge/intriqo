# =============================================================================
# Intriqo — docker-compose.yml
#
# Infrastructure services for local development.
# Application containers (engine, control-plane, agents, frontend) are defined
# in infrastructure/compose/ and overlaid when needed.
#
# Usage:
#   docker compose up -d            Start all infrastructure services
#   docker compose down             Stop and remove containers
#   docker compose logs -f          Follow logs
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: intriqo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-intriqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intriqo_dev}
      POSTGRES_DB:       ${POSTGRES_DB:-intriqo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intriqo}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: intriqo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: intriqo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus:ro
    profiles:
      - observability

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: intriqo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/observability/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    profiles:
      - observability

volumes:
  postgres_data:
  grafana_data:

networks:
  default:
    name: intriqo-network
