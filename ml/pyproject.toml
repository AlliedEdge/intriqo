[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intriqo-ml"
version = "0.1.0"
description = "Intriqo ML — anomaly detection models, feature engineering, and experiments"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "seaborn>=0.13.0",
]
deep = [
    "torch>=2.2.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
