name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday 02:00 UTC
    - cron: "0 2 * * 1"

jobs:
  # ── Python dependency audit ───────────────────────────────────────────────
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit agents
        run: |
          if [ -f agents/pyproject.toml ]; then
            pip-audit --requirement <(pip install -e agents/ --dry-run 2>/dev/null | grep Requirement || true) || true
          fi
      - name: Audit control-plane
        run: |
          if [ -f control-plane/pyproject.toml ]; then
            pip-audit --requirement <(pip install -e control-plane/ --dry-run 2>/dev/null | grep Requirement || true) || true
          fi

  # ── npm audit ─────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit frontend
        run: |
          if [ -f frontend/dashboard/package.json ]; then
            cd frontend/dashboard && npm audit --audit-level=high || true
          fi

  # ── Secret scanning (Gitleaks) ────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CodeQL (Python + C++) ─────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-22.04
    permissions:
      actions:        read
      contents:       read
      security-events: write
    strategy:
      matrix:
        language: [python, cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
