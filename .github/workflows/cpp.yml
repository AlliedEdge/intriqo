name: Engine (C++)

on:
  push:
    paths:
      - "engine/**"
      - "CMakeLists.txt"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "engine/**"
      - "CMakeLists.txt"

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        compiler: [gcc-12, clang-15]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libpcap-dev \
            ${{ matrix.compiler == 'clang-15' && 'clang-15' || 'g++-12' }}

      - name: Set compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "clang-15" ]]; then
            echo "CC=clang-15"   >> $GITHUB_ENV
            echo "CXX=clang++-15" >> $GITHUB_ENV
          else
            echo "CC=gcc-12"  >> $GITHUB_ENV
            echo "CXX=g++-12" >> $GITHUB_ENV
          fi

      - name: Configure
        run: |
          cmake -S engine -B engine/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DINTRIQO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build engine/build --parallel

      - name: Test
        run: ctest --test-dir engine/build --output-on-failure --parallel 4

  asan:
    name: ASAN + UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build libpcap-dev clang-15

      - name: Configure with ASAN
        env:
          CC:  clang-15
          CXX: clang++-15
        run: |
          cmake -S engine -B engine/build-asan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DINTRIQO_BUILD_TESTS=ON \
            -DINTRIQO_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build engine/build-asan --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        run: ctest --test-dir engine/build-asan --output-on-failure
